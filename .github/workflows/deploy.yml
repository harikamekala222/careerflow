name: CareerFlow Docker Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "========================================"
            echo "Starting CareerFlow deployment"
            echo "========================================"

            cd ~/careerflow

            echo "Checking current containers..."
            docker compose ps

            echo "Stopping existing containers..."
            docker compose down

            echo "Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building updated Docker images..."
            docker compose build --no-cache

            echo "Starting updated containers..."
            docker compose up -d

            echo "Waiting for containers..."
            sleep 10

            echo "Checking container status..."
            docker compose ps

            echo "Checking backend logs..."
            docker logs careerflow-backend-1 --tail 20

            echo "Checking frontend..."
            curl -f http://localhost:5173/health

            echo "========================================"
            echo "CareerFlow deployment successful!"
            echo "========================================"
